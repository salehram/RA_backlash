[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-backlash"
version = "0.2.0"
description = "Experimental desktop RA backlash measurement and simulation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
    "pywin32>=306; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ra-backlash = "ra_backlash_app.gui:main"

[tool.setuptools]
py-modules = ["ra_backlash"]
packages = ["ra_backlash_app"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# This desktop suite has a QApplication 'app' fixture, not a Flask application.
# An unrelated globally installed pytest-flask plugin must not reinterpret it.
addopts = "-p no:flask"