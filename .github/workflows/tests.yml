name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-desktop:
    name: Simulator and offscreen desktop / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tests
        run: python -m pip install ".[dev]"
      - name: Check desktop dependencies (do not silently skip Qt tests)
        run: python -c "import PySide6, pyqtgraph, ra_backlash, ra_backlash_app.gui"
      - name: Run numerical, mock-driver and offscreen desktop tests
        run: python -m pytest -q